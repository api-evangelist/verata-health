name: Verata Health
description: 'Verata Health was a Minneapolis-based healthcare AI company that automated
  prior authorization for providers and payers — preparing prior authorizations, identifying
  payer rules, retrieving clinical documentation, and returning payer decisions, including
  a SMART on FHIR app (Verata Pathway). It was backed by Bessemer Venture Partners,
  LRVHealth and BlueCross BlueShield Venture Partners, and was acquired by Olive AI in
  December 2020 (reported ~$120M). Olive AI ceased operations in October 2023. Verata
  Health operates no live public API surface today; the veratahealth.com domain now
  resolves to a parked lander. This profile is retained as an honest historical
  record — there is no developer portal, OpenAPI, or SDK to enrich.'
